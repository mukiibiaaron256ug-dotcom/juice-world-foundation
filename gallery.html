<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery | Juice World Foundation Uganda</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7f4;
    color:#333;
}

header{
    background:#0b6e2f;
    color:white;
    text-align:center;
    padding:60px 20px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:30px;
    max-width:1100px;
    margin:auto;
}

.gallery img{
    width:100%;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:30px;
}
</style>
</head>

<body>

<header>
<h1>Gallery</h1>
<p>Moments from Juice World Foundation Uganda</p>
</header>

<div class="gallery">

<img src="images/photo1.jpg" alt="Children">
<img src="images/photo2.jpg" alt="Foundation Activity">
<img src="images/photo3.jpg" alt="Food Distribution">
<img src="images/photo4.jpg" alt="Community Support">
<img src="images/photo5.jpg" alt="Volunteers">
<img src="images/photo6.jpg" alt="Children Smiling">

</div>

<footer>
<p>© 2026 Juice World Foundation Uganda</p>
</footer>

</body>
</html>
