<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery | Juice World Foundation Uganda</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
body{background:#f4f7f4;color:#333}
header{background:#0b6e2f;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-size:18px}
.brand img{width:52px;height:52px;border-radius:50%;object-fit:contain}
.menu{font-size:32px;color:#fff;cursor:pointer}
nav{display:none;background:#fff;box-shadow:0 5px 20px rgba(0,0,0,.15)}
nav.active{display:block}
nav a{display:block;padding:16px;color:#0b6e2f;font-weight:bold;text-decoration:none;border-bottom:1px solid #eee}
main{max-width:1100px;margin:auto;padding:35px 18px 55px}
h1{text-align:center;color:#0b6e2f;margin-bottom:10px}
.lead{text-align:center;color:#666;margin-bottom:28px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
figure{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.12)}
figure img{width:100%;height:300px;object-fit:cover;display:block}
figcaption{padding:12px;text-align:center;font-weight:bold;color:#0b6e2f}
footer{background:#064b1d;color:#fff;text-align:center;padding:22px 15px}
footer span{color:#D4AF37}
@media(max-width:650px){.grid{grid-template-columns:1fr}figure img{height:250px}}
</style>
</head>
<body>
<header>
<div class="brand"><img src="images/logo.png" alt="Logo"><strong>Juice World Foundation Uganda</strong></div>
<div class="menu" onclick="menu()">☰</div>
</header>
<nav id="nav">
<a href="index.html">🏠 Home</a>
<a href="gallery.html">🖼 Gallery</a>
<a href="volunteers.html">👥 Volunteers</a>
<a href="partners.html">🤝 Partners</a>
<a href="ways-to-help.html">💚 Ways to Help</a>
<a href="policies.html">📜 Policies</a>
</nav>
<main>
<h1>Our Gallery</h1>
<p class="lead">Moments from our community and volunteer activities in Uganda.</p>
<div class="grid">
<figure><img src="images/gallery-1.jpg" alt="Juice World Foundation community photo"><figcaption>Community Moments</figcaption></figure>
<figure><img src="images/gallery-2.jpg" alt="Juice World Foundation volunteer photo"><figcaption>Our Volunteers</figcaption></figure>
<figure><img src="images/gallery-3.jpg" alt="Juice World Foundation community photo"><figcaption>Together for a Better Future</figcaption></figure>
<figure><img src="images/gallery-4.jpg" alt="Juice World Foundation community photo"><figcaption>Serving Our Community</figcaption></figure>
<figure><img src="images/gallery-5.jpg" alt="Juice World Foundation community photo"><figcaption>Making a Difference</figcaption></figure>
</div>
</main>
<footer>© 2026 <span>Juice World Foundation Uganda</span>. All Rights Reserved.</footer>
<script>function menu(){document.getElementById('nav').classList.toggle('active')}</script>
</body>
</html>
