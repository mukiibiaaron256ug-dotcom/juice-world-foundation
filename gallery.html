<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery | Juice World Foundation Uganda</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7f4;
    color:#333;
}

header{
    background:#0b6e2f;
    color:white;
    text-align:center;
    padding:60px 20px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:30px;
    max-width:1100px;
    margin:auto;
}

.gallery img{
    width:100%;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:30px;
}

/* === Shared mobile hamburger navigation === */
.site-menu-btn{
    display:block;
    border:0;
    background:transparent;
    color:#fff;
    font-size:32px;
    line-height:1;
    cursor:pointer;
    padding:6px 8px;
}
.site-nav{
    display:none;
    background:#fff;
    box-shadow:0 6px 20px rgba(0,0,0,.14);
    position:relative;
    z-index:998;
}
.site-nav.open{display:block}
.site-nav a{
    display:block;
    padding:15px 18px;
    color:#0b6e2f;
    text-decoration:none;
    font-weight:700;
    border-bottom:1px solid #eee;
}
.site-nav a:hover{background:#f4f7f4;color:#D4AF37}

</style>
</head>

<body>
<button class="site-menu-btn" onclick="toggleSiteMenu()" aria-label="Open navigation menu" aria-controls="siteNav">☰</button>

<nav class="site-nav" id="siteNav">
<a href="index.html">🏠 Home</a>
<a href="our-story.html">📖 Our Story</a>
<a href="projects.html">❤️ Projects</a>
<a href="gallery.html">🖼 Gallery</a>
<a href="team.html">👥 Team</a>
<a href="events.html">🎉 Events</a>
<a href="news.html">📰 News</a>
<a href="partners.html">🤝 Partners</a>
<a href="ways-to-help.html">💚 Ways to Help</a>
<a href="contact.html">📞 Contact</a>
<a href="policies.html">📜 Policies</a>
</nav>



<header>
<h1>Gallery</h1>
<p>Moments from Juice World Foundation Uganda</p>
</header>

<div class="gallery">

<img src="images/photo1.jpg" alt="Children">

<img src="images/photo3.jpg" alt="Food Distribution">
<img src="images/photo4.jpg" alt="Community Support">
<img src="images/photo5.jpg" alt="Volunteers">
<img src="images/photo6.jpg" alt="Children Smiling">

</div>

<footer>
<p>© 2026 Juice World Foundation Uganda</p>
</footer>


<script>
function toggleSiteMenu(){
    var nav=document.getElementById('siteNav');
    if(nav) nav.classList.toggle('open');
}
</script>

</body>
</html>
