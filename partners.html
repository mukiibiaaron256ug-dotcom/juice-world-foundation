let isAdmin=false;const P=[["Shiarona Film Productions","Supporting awareness campaigns, media production and community outreach.","256752190458"],["Mask Geng Dancers Africa","Supporting youth talent, entertainment and cultural activities.","256745558950"],["Kimanlee Kung Fu Academy","Promoting health, fitness and community wellbeing.","256759849636"],["Juice Wrld Tours and Travels","Supporting outreach programmes and fundraising activities.","256745688224"],["Riyal Film Productions","Supporting storytelling, media production and awareness campaigns.","256768155106"],["Joy Hair Dressing and Make Up","Providing professional hair dressing, beauty and make-up services while supporting community empowerment.","256745228537"]];
function toggleSiteMenu(){siteNav.classList.toggle("open")}function closeLogo(){modal.classList.remove("open")}function openLogo(u){big.src=u;modal.classList.add("open")}
async function getSession(){
  const {data}=await sb.auth.getSession();
  return data.session;
}
async function adminLogin(){
  const session=await getSession();
  if(session){ await sb.auth.signOut(); isAdmin=false; document.getElementById("state").textContent=""; document.querySelectorAll(".admin-upload").forEach(x=>x.classList.remove("show")); if(typeof render==="function") render(); return; }
  const email=prompt("Enter your Supabase admin email:");
  if(!email) return;
  const password=prompt("Enter your Supabase admin password:");
  if(!password) return;
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error){alert("Admin login failed: "+error.message);return}
  isAdmin=true;
  document.getElementById("state").textContent=" • Admin mode ON";
  document.querySelectorAll(".admin-upload").forEach(x=>x.classList.add("show"));
  if(typeof render==="function") render();
}

async function logo(i){let r=await sb.storage.from(BUCKET).list("partners",{limit:100});if(r.error)return null;let f=(r.data||[]).filter(x=>x.name.startsWith("partner-"+i+"-")).pop();return f?sb.storage.from(BUCKET).getPublicUrl("partners/"+f.name).data.publicUrl:null}
async function uploadLogo(i){let x=document.getElementById("file-"+i);if(!x.files.length)return;let f=x.files[0],n="partners/partner-"+i+"-"+Date.now()+"-"+f.name.replace(/[^a-zA-Z0-9._-]/g,"-");let r=await sb.storage.from(BUCKET).upload(n,f,{contentType:f.type});if(r.error){alert(r.error.message);return}x.value="";render()}
async function render(){grid.innerHTML="";for(let i=0;i<P.length;i++){let p=P[i],u=await logo(i),c=document.createElement("article");c.className="card";c.innerHTML='<div class="logo-box">'+(u?'<img src="'+u+'" alt="'+p[0]+' logo">':'<span class="small">No logo uploaded yet</span>')+'</div><h2>'+p[0]+'</h2><p>'+p[1]+'</p><div class="buttons"><a class="btn whatsapp" href="https://wa.me/'+p[2]+'" target="_blank">💬 WhatsApp Partner</a><a class="btn call" href="tel:+'+p[2]+'">📞 Call Partner</a></div>'+(isAdmin?'<div class="admin-upload show" style="margin-top:14px"><input id="file-'+i+'" type="file" accept="image/*"><button class="btn upload-btn" onclick="uploadLogo('+i+')">＋ Change Logo</button></div>':'');if(u)c.querySelector(".logo-box").onclick=()=>openLogo(u);grid.appendChild(c)}}
render();
