<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our Partners | Juice World Foundation Uganda</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f4;color:#333}
header{position:sticky;top:0;z-index:20;background:#0b6e2f;color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 5px 18px #0003}
.logo{font-weight:800;font-size:20px}.logo span{color:#ffd447}.menu-btn{font-size:34px;cursor:pointer}
nav{display:none;background:#fff;position:sticky;top:78px;z-index:19;box-shadow:0 8px 20px #0002}nav.open{display:block}nav a{display:block;padding:14px 18px;color:#0b6e2f;text-decoration:none;font-weight:700;border-bottom:1px solid #eee}
.wrap{max-width:1100px;margin:auto;padding:30px 18px}.hero{background:linear-gradient(135deg,#064b1d,#0b6e2f);color:#fff;border-radius:25px;padding:34px;box-shadow:0 12px 30px #0002}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{border:0;border-radius:30px;padding:11px 17px;font-weight:800;cursor:pointer;background:#ffd447;color:#173c22;box-shadow:0 6px 0 #b18c18}.btn.alt{background:#fff;color:#0b6e2f}
.admin{display:none;margin-top:18px;background:#ffffff12;border:1px solid #ffffff44;padding:15px;border-radius:15px}.admin.show{display:block}.admin input{padding:10px;border-radius:10px;border:1px solid #ddd;margin:5px 0;width:100%}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:25px}.card{background:#fff;border-radius:20px;padding:20px;text-align:center;box-shadow:0 8px 22px #0001}.card img{width:150px;height:150px;object-fit:contain;border-radius:18px;background:#f6f8f6;cursor:pointer}.card h2{color:#0b6e2f;margin:12px 0 7px}.card p{line-height:1.6;color:#666}.wa{display:inline-block;margin:8px 4px 0;background:#25d366;color:#fff;text-decoration:none;padding:10px 15px;border-radius:25px;font-weight:800}.call{display:inline-block;margin:8px 4px 0;background:#0b6e2f;color:#fff;text-decoration:none;padding:10px 15px;border-radius:25px;font-weight:800}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><div class="logo">Juice World Foundation <span>Uganda</span></div><div class="menu-btn" onclick="toggleMenu()">☰</div></header>
<nav id="nav"><a href="index.html">🏠 Home</a><a href="our-story.html">📖 Our Story</a><a href="projects.html">❤️ Projects</a><a href="gallery.html">🖼 Gallery</a><a href="team.html">👥 Team</a><a href="events.html">🎉 Events</a><a href="news.html">📰 News</a><a href="partners.html">🤝 Partners</a><a href="ways-to-help.html">💚 Ways to Help</a><a href="contact.html">📞 Contact</a><a href="policies.html">📜 Policies</a></nav>
<main class="wrap"><section class="hero"><h1>Our Partners</h1><p>Meet the organisations and people supporting our mission.</p><div class="actions"><button class="btn" onclick="adminLogin()">🔐 Admin Login</button><button class="btn alt" id="logout" style="display:none" onclick="logout()">Log out</button></div>
<div class="admin" id="admin"><strong>Add a partner</strong><input id="pname" placeholder="Partner name"><input id="pdesc" placeholder="Short description"><input id="pwa" placeholder="WhatsApp number, e.g. 2567..."><input id="pphone" placeholder="Phone number, e.g. 2567..."><input id="plogo" type="file" accept="image/*"><button class="btn" onclick="addPartner()">➕ Add Partner</button><span id="status"></span></div></section>
<div id="grid" class="grid"><p>Loading partners…</p></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient("https://opswzofkuqqqwsturikd.supabase.co","sb_publishable_iUC_xkZzmW3_oly9NIMb4g_BbXc9-mM");
let session=null;const $=id=>document.getElementById(id);
function toggleMenu(){$("nav").classList.toggle("open")}
async function refreshSession(){const r=await sb.auth.getSession();session=r.data.session;$("admin").classList.toggle("show",!!session);$("logout").style.display=session?"inline-block":"none";loadPartners()}
async function adminLogin(){const email=prompt("Supabase admin email:");if(!email)return;const password=prompt("Supabase admin password:");if(!password)return;const r=await sb.auth.signInWithPassword({email,password});if(r.error){alert("Login failed: "+r.error.message);return}await refreshSession();alert("Admin mode is ON.")}
async function logout(){await sb.auth.signOut();await refreshSession()}
function publicUrl(path){return path?sb.storage.from("gallery").getPublicUrl(path).data.publicUrl:""}
async function loadPartners(){const g=$("grid");g.innerHTML="<p>Loading…</p>";const r=await sb.from("partners").select("*").eq("is_active",true).order("created_at",{ascending:true});if(r.error){g.innerHTML="<p>Could not fetch partners: "+esc(r.error.message)+"</p>";return}if(!r.data?.length){g.innerHTML="<p>No partners found.</p>";return}g.innerHTML=r.data.map(p=>`<article class="card">${p.logo_path?`<img src="${esc(publicUrl(p.logo_path))}" alt="${esc(p.name)}" onclick="window.open(this.src,'_blank')">`:"<div style='height:150px;padding-top:55px;font-size:42px'>🤝</div>"}<h2>${esc(p.name)}</h2><p>${esc(p.description||"")}</p>${p.whatsapp_number?`<a class="wa" href="https://wa.me/${digits(p.whatsapp_number)}" target="_blank">💬 WhatsApp</a>`:""}${p.phone_number?`<a class="call" href="tel:+${digits(p.phone_number)}">📞 Call</a>`:""}${session?`<br><button class="btn" style="margin-top:12px" onclick="changeLogo('${p.id}')">➕ Change Logo</button> <button class="btn" style="margin-top:12px" onclick="removePartner('${p.id}')">Delete</button>`:""}</article>`).join("")}
async function addPartner(){if(!session){alert("Admin login required.");return}const name=$("pname").value.trim();if(!name){alert("Enter a partner name.");return}const logo=$("plogo").files[0];let logo_path=null;if(logo){if(logo.size>8*1024*1024){alert("Logo must be under 8 MB.");return}const ext=(logo.name.split(".").pop()||"png").toLowerCase().replace(/[^a-z0-9]/g,"");logo_path=`partners/${Date.now()}-${crypto.randomUUID()}.${ext}`;const u=await sb.storage.from("gallery").upload(logo_path,logo,{contentType:logo.type});if(u.error){alert("Logo upload failed: "+u.error.message);return}}const r=await sb.from("partners").insert({name,description:$("pdesc").value.trim(),whatsapp_number:$("pwa").value.trim(),phone_number:$("pphone").value.trim(),logo_path});if(r.error){if(logo_path)await sb.storage.from("gallery").remove([logo_path]);alert("Partner save failed: "+r.error.message);return}["pname","pdesc","pwa","pphone"].forEach(id=>$(id).value="");$("plogo").value="";loadPartners()}
async function changeLogo(id){if(!session)return;const fileInput=document.createElement("input");fileInput.type="file";fileInput.accept="image/*";fileInput.onchange=async()=>{const f=fileInput.files[0];if(!f)return;const ext=(f.name.split(".").pop()||"png").toLowerCase().replace(/[^a-z0-9]/g,"");const path=`partners/${Date.now()}-${crypto.randomUUID()}.${ext}`;const u=await sb.storage.from("gallery").upload(path,f,{contentType:f.type});if(u.error){alert(u.error.message);return}const old=(await sb.from("partners").select("logo_path").eq("id",id).single()).data?.logo_path;const r=await sb.from("partners").update({logo_path:path}).eq("id",id);if(r.error){await sb.storage.from("gallery").remove([path]);alert(r.error.message);return}if(old)await sb.storage.from("gallery").remove([old]);loadPartners()};fileInput.click()}
async function removePartner(id){if(!session||!confirm("Delete this partner?"))return;const r=await sb.from("partners").update({is_active:false}).eq("id",id);if(r.error){alert(r.error.message);return}loadPartners()}
function digits(x){return String(x).replace(/\D/g,"")}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
sb.auth.onAuthStateChange(()=>refreshSession());refreshSession();
</script></body></html>
