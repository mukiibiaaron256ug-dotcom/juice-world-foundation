<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Juice World Foundation Uganda</title>

<meta name="description" content="Giving hope, love and a better future to vulnerable children in Uganda.">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
scroll-behavior:smooth;
}

body{
background:#f5f7f5;
color:#333;
line-height:1.7;
}

/* HEADER */

header{
background:linear-gradient(rgba(11,110,47,.88),rgba(11,110,47,.88)),url("images/header.jpg");
background-size:cover;
background-position:center;
text-align:center;
color:white;
padding:60px 20px;
}

header img{
width:120px;
height:120px;
border-radius:50%;
background:white;
padding:8px;
object-fit:cover;
margin-bottom:20px;
}

header h1{
font-size:40px;
margin-bottom:10px;
}

header p{
font-size:20px;
max-width:700px;
margin:auto;
}

.button{
display:inline-block;
margin-top:25px;
padding:14px 30px;
background:white;
color:#0b6e2f;
text-decoration:none;
border-radius:30px;
font-weight:bold;
transition:.3s;
}

.button:hover{
background:#FFD54F;
color:#000;
}

/* NAVIGATION */

nav{
background:#0b5e2f;
overflow-x:auto;
white-space:nowrap;
position:sticky;
top:0;
z-index:999;
}

nav::-webkit-scrollbar{
display:none;
}

nav ul{
display:flex;
list-style:none;
}

nav li{
flex:0 0 auto;
}

nav a{
display:block;
padding:16px 22px;
text-decoration:none;
color:white;
font-weight:bold;
transition:.3s;
}

nav a:hover{
background:#0f7a3d;
}

section{
max-width:1100px;
margin:30px auto;
padding:30px;
background:white;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,.1);
}

h2{
color:#0b6e2f;
margin-bottom:15px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:20px;
}

.card{
background:#f8f8f8;
padding:20px;
border-left:5px solid #0b6e2f;
border-radius:10px;
transition:.3s;
}

.card:hover{
transform:translateY(-6px);
}

@media(max-width:768px){

header{
padding:40px 15px;
}

header h1{
font-size:28px;
}

header p{
font-size:17px;
}

header img{
width:90px;
height:90px;
}

section{
margin:15px;
padding:20px;
}

.cards{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<header>

<img src="images/logo.png" alt="Juice World Foundation Logo">

<h1>Juice World Foundation Uganda</h1>

<p>
Giving Hope, Love and a Better Future to Every Child.
</p>

</ul>

</nav>
