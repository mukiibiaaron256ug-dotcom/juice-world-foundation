<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Juice World Foundation Uganda logo">
<defs>
<linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#FFE27A"/>
<stop offset=".5" stop-color="#D4AF37"/>
<stop offset="1" stop-color="#9c7a1f"/>
</linearGradient>
<linearGradient id="heartGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#22B863"/>
<stop offset="1" stop-color="#0B6E2F"/>
</linearGradient>
<linearGradient id="sunGrad" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#FFD75A"/>
<stop offset="1" stop-color="#F2A93B"/>
</linearGradient>
</defs>

<!-- outer ring -->
<circle cx="100" cy="100" r="96" fill="#fff"/>
<circle cx="100" cy="100" r="93" fill="none" stroke="url(#ringGrad)" stroke-width="6"/>
<circle cx="100" cy="100" r="83" fill="#F7FBF8" stroke="#0B6E2F" stroke-width="1.5"/>

<!-- sun rays behind heart -->
<g stroke="url(#sunGrad)" stroke-width="3" stroke-linecap="round" opacity=".9">
<path d="M100 58v-10"/>
<path d="M79 64l-6-8"/>
<path d="M121 64l6-8"/>
<path d="M64 79l-8-6"/>
<path d="M136 79l8-6"/>
</g>
<circle cx="100" cy="80" r="14" fill="url(#sunGrad)"/>

<!-- two hands cupping a heart (love / care / community) -->
<path d="M46 118c2-14 14-24 27-22 8 1 13 6 17 11 4-5 9-10 17-11 13-2 25 8 27 22 2 15-10 27-25 35-7 4-13 8-19 14-6-6-12-10-19-14-15-8-27-20-25-35z" fill="url(#heartGrad)" stroke="#075A2A" stroke-width="2"/>
<path d="M100 128c-3-6-13-15-13-24 0-6 7-9 13-3 6-6 13-3 13 3 0 9-10 18-13 24z" fill="#FFE27A"/>

<!-- hands silhouette cradling the heart -->
<path d="M40 122c6-10 16-14 24-9l4 3" fill="none" stroke="#0B6E2F" stroke-width="7" stroke-linecap="round"/>
<path d="M160 122c-6-10-16-14-24-9l-4 3" fill="none" stroke="#0B6E2F" stroke-width="7" stroke-linecap="round"/>
<path d="M56 128c4 10 12 16 20 16" fill="none" stroke="#0B6E2F" stroke-width="5" stroke-linecap="round"/>
<path d="M144 128c-4 10-12 16-20 16" fill="none" stroke="#0B6E2F" stroke-width="5" stroke-linecap="round"/>
</svg>
